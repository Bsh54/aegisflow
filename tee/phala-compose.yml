# Phala Cloud (dstack) deployment — runs the AegisFlow verifier inside a
# confidential VM. The enclave bootstraps the code straight from the public
# GitHub repo, so what runs in the TEE is exactly what is auditable on GitHub.
services:
  aml-verifier:
    image: python:3.12-slim
    ports:
      - "8000:8000"
    environment:
      - MOCK_MODE=false
    command:
      - /bin/sh
      - -c
      - |
        set -e
        pip install --no-cache-dir fastapi==0.115.0 "uvicorn[standard]==0.30.6" httpx==0.27.2 pydantic==2.9.2
        mkdir -p /app && cd /app
        python -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/Bsh54/aegisflow/main/tee/app.py','/app/app.py')"
        uvicorn app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
